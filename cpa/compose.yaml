services:
  cpa:
    container_name: cpa
    image: eceasy/cli-proxy-api:${TAG:-latest}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./mount/config.yaml
        target: /CLIProxyAPI/config.yaml
        bind:
          create_host_path: false
      - auth:/root/.cli-proxy-api
      - logs:/CLIProxyAPI/logs

volumes:
  auth:
  logs:

networks:
  default:
    name: cpa
