services:
  postgres:
    container_name: atlassian_postgres
    image: postgres:${POSTGRES_TAG:-11}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_passwd
    secrets:
      - postgres_passwd
    hostname: postgres
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-$${POSTGRES_USER:-postgres}}" || exit 1'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s

volumes:
  postgres_data:

secrets:
  postgres_passwd:
    file: ./secrets/postgres_passwd
