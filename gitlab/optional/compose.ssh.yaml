x-setup-notes: |
  1. Create the host git user with fixed UID/GID and home directory:

  ```bash
  groupadd -g 2222 git
  useradd -u 2222 -g 2222 -d /var/opt/gitlab -m -s /bin/sh git
  ```

  2. Create the SSH directory and generate the trampoline key:

  ```bash
  install -d -m 700 -o git -g git /var/opt/gitlab/.ssh
  sudo -u git ssh-keygen -t ed25519 -f /var/opt/gitlab/.ssh/gitlab_trampoline -N ''
  ```

  3. Configure GitLab with the same UID/GID in gitlab.rb:

  ```ruby
  user['uid'] = 2222
  user['gid'] = 2222
  manage_accounts['enable'] = true
  ```

  4. Install the host gitlab-shell wrapper:

  ```bash
  install -d /opt/gitlab/embedded/service/gitlab-shell/bin

  printf '%s\n' \
    '#!/bin/sh' \
    'exec ssh \' \
    '  -o BatchMode=yes \' \
    '  -o StrictHostKeyChecking=accept-new \' \
    '  -i /var/opt/gitlab/.ssh/gitlab_trampoline \' \
    '  -p 2222 git@127.0.0.1 \' \
    '  "SSH_ORIGINAL_COMMAND=$(env printf "%q" "$SSH_ORIGINAL_COMMAND")" \' \
    '  "$0" "$@"' \
    >/opt/gitlab/embedded/service/gitlab-shell/bin/gitlab-shell

  chmod 755 /opt/gitlab/embedded/service/gitlab-shell/bin/gitlab-shell
  ```

  5. Harden host SSH access for the git user:

  ```bash
  printf '%s\n' \
    'Match User git' \
    '    PasswordAuthentication no' \
    '    KbdInteractiveAuthentication no' \
    '    X11Forwarding no' \
    '    AllowAgentForwarding no' \
    '    AllowTcpForwarding no' \
    '    PermitTunnel no' \
    '    PermitTTY no' \
    >/etc/ssh/sshd_config.d/git.conf

  systemctl reload ssh
  ```

services:
  gitlab:
    ports:
      - "127.0.0.1:${SSH_PORT:-2222}:22"
    volumes:
      - /var/opt/gitlab/.ssh:/var/opt/gitlab/.ssh
      - /var/opt/gitlab/.ssh/gitlab_trampoline.pub:/gitlab-data/ssh/authorized_keys:ro