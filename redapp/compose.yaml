services:
  redapp:
    container_name: redapp
    image: ghcr.io/pmextra/redapp:${TAG:-latest}
    volumes:
      - data:/var/lib/redapp
    environment:
      REDAPP_PUBLIC_URL: ${REDAPP_PUBLIC_URL:?Set REDAPP_PUBLIC_URL to the external HTTP(S) origin in redapp/.env}
      # Uncomment with the corresponding .env setting to trust verified proxies.
      # REDAPP_TRUSTED_PROXIES: ${REDAPP_TRUSTED_PROXIES:?Set verified proxy IP/CIDRs in redapp/.env}
    read_only: true
    stop_grace_period: 30s
    hostname: redapp
    restart: unless-stopped

volumes:
  data:

networks:
  default:
    name: redapp
