services:
  v2ray:
    container_name: v2ray
    image: v2fly/v2fly-core:${TAG:-latest}
    command: run
    volumes:
      - config:/etc/v2ray
    environment:
      V2RAY_LOCATION_CONFDIR: /etc/v2ray
    hostname: v2ray
    restart: unless-stopped

volumes:
  config:

networks:
  default:
    name: v2ray
