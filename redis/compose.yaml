services:
  redis:
    container_name: redis
    image: redis:${TAG:-latest}
    volumes:
      - data:/data
    hostname: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s

volumes:
  data:

networks:
  default:
    name: redis
