services:
  postgres:
    container_name: postgres
    image: postgres:${TAG:?Set TAG explicitly in postgres/.env to select a PostgreSQL version}
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST_AUTH_METHOD
    hostname: postgres
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-$${POSTGRES_USER:-postgres}}" || exit 1'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s

volumes:
  data:

networks:
  default:
    name: postgres
