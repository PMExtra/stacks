services:
  postgres:
    container_name: postgres
    image: postgres:${TAG:?Set TAG explicitly in postgres/.env to select a PostgreSQL version}
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST_AUTH_METHOD
    hostname: postgres
    restart: unless-stopped

volumes:
  data:

networks:
  default:
    name: postgres
