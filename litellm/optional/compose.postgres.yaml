services:
  postgres:
    container_name: litellm_postgres
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-$${POSTGRES_USER:-postgres}}" || exit 1'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s

  litellm:
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required}@postgres:5432/litellm
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
